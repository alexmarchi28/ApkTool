# Esegue vet e test su Windows, Linux e macOS a ogni push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Formattazione
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test con il race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      # -fuzzminimizetime è basso perché la minimizzazione di ogni input nuovo
      # dura altrimenti fino a 60 s e occupa tutto il tempo di fuzzing.
      - name: Fuzzing breve dei parser e della modifica del manifest
        if: runner.os == 'Linux'
        run: |
          go test -run XXX -fuzz '^FuzzParseXML$' -fuzztime 30s -fuzzminimizetime 5s ./internal/binres
          go test -run XXX -fuzz '^FuzzParseTable$' -fuzztime 30s -fuzzminimizetime 5s ./internal/binres
          go test -run XXX -fuzz '^FuzzEdit$' -fuzztime 30s -fuzzminimizetime 5s ./internal/manifest
          go test -run XXX -fuzz '^FuzzVerifyV2$' -fuzztime 20s -fuzzminimizetime 5s ./internal/apksign
