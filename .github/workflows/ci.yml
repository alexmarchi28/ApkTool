# Esegue vet e test su Windows, Linux e macOS a ogni push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formattazione
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Fuzzing breve dei parser
        if: runner.os == 'Linux'
        run: |
          go test -run XXX -fuzz FuzzParseXML -fuzztime 30s ./internal/binres
          go test -run XXX -fuzz FuzzParseTable -fuzztime 30s ./internal/binres
